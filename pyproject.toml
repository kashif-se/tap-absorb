[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tap-absorb"
version = "0.1.0"
description = "Singer tap for Absorb LMS, built on the Meltano Singer SDK."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kashif Sohail", email = "me@kashifsohail.com" }]
keywords = ["singer", "tap", "meltano", "absorb", "lms"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "singer-sdk>=0.36.0,<1",
    "requests>=2.28.0",
    "backoff>=2.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "responses>=0.23.0",
    "singer-sdk[testing]>=0.36.0,<1",
]

[project.scripts]
tap-absorb = "tap_absorb.tap:TapAbsorb.cli"

[project.urls]
Homepage = "https://kashifsohail.com"
"Bug Tracker" = "https://github.com/kashif-se/tap-absorb/issues"

[tool.hatch.build.targets.wheel]
packages = ["tap_absorb"]

[tool.pytest.ini_options]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
